<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteile am Geobrett</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f4f7f6;
            --board-color: #deba93;
            --board-shadow: #b08d6a;
            --success-color: #27ae60;
            --error-color: #c0392b;
        }
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: row;
        }
        .left-pane {
            flex: 1;
            padding: 30px;
            background-color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .right-pane {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            margin-top: 0;
            font-size: 2rem;
            color: var(--primary-color);
        }
        
        /* Scoreboard */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            background-color: #34495e;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        p.instruction {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #555;
            margin-bottom: 30px;
        }
        .interaction-area {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
        }
        .fraction input {
            width: 100%;
            text-align: center;
            font-size: 1.3rem;
            padding: 8px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            transition: border-color 0.3s;
        }
        .fraction input:focus {
            outline: none;
            border-color: #3498db;
        }
        .fraction input:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            border-color: #dcdcdc;
        }
        
        /* Pfeile bei Nummerneingabe entfernen */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .fraction hr {
            width: 100%;
            border: none;
            border-top: 3px solid var(--primary-color);
            margin: 8px 0;
        }
        .label-text {
            font-size: 1.1rem;
            font-weight: bold;
        }
        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active {
            transform: scale(0.97);
        }
        button:disabled {
            background-color: #bdc3c7 !important;
            color: #7f8c8d !important;
            box-shadow: none !important;
            cursor: not-allowed;
            transform: none;
        }
        #checkBtn {
            background-color: #3498db;
            color: white;
            box-shadow: 0 4px #2980b9;
            margin-top: 15px;
        }
        #checkBtn:hover:not(:disabled) { background-color: #2980b9; }
        #nextBtn {
            background-color: #95a5a6;
            color: white;
            box-shadow: 0 4px #7f8c8d;
            margin-top: 30px;
            align-self: flex-start;
        }
        #nextBtn:hover:not(:disabled) { background-color: #7f8c8d; }
        #feedback {
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feedback-success { color: var(--success-color); }
        .feedback-error { color: var(--error-color); }
        .feedback-info { color: #2980b9; font-weight: normal; }

        canvas {
            background-color: var(--board-color);
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.2);
            border-bottom: 8px solid var(--board-shadow);
            border-right: 4px solid var(--board-shadow);
            max-width: 100%;
            height: auto;
        }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .left-pane { padding: 20px; }
            .right-pane { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="left-pane">
            <canvas id="geoboard" width="500" height="500"></canvas>
        </div>
        
        <div class="right-pane">
            <h1>Anteile am Geobrett</h1>
            
            <div class="scoreboard">
                <span id="roundDisplay">Runde: 0</span>
                <span id="scoreDisplay">Punkte: 0</span>
            </div>

            <p class="instruction">
                Bestimme den Anteil der grünen ("eingezäunten") Fläche an der gesamten Fläche des Geobretts.<br>
                Trage Zähler und Nenner in die Eingabefelder ein.
            </p>

            <div class="interaction-area">
                <span class="label-text">Der Anteil beträgt:</span>
                <div class="fraction">
                    <input type="text" id="num" placeholder="grün" autocomplete="off" disabled>
                    <hr>
                    <input type="number" id="den" placeholder="gesamt" autocomplete="off" disabled>
                </div>
                <button id="checkBtn" disabled>Prüfen</button>
            </div>

            <div id="feedback"></div>

            <button id="nextBtn">Neue Aufgabe</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('geoboard');
        const ctx = canvas.getContext('2d');
        const numInput = document.getElementById('num');
        const denInput = document.getElementById('den');
        const feedbackDiv = document.getElementById('feedback');
        const checkBtn = document.getElementById('checkBtn');
        const nextBtn = document.getElementById('nextBtn');
        const roundDisplay = document.getElementById('roundDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');

        let currentN = 0; 
        let targetArea = 0;
        let totalArea = 0;
        
        // Zähler Variablen
        let round = 0;
        let score = 0;
        let taskActive = false;
        let taskSolved = false;

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(frequency, type, duration, startTime) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start(audioCtx.currentTime + startTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + startTime + duration);
            oscillator.stop(audioCtx.currentTime + startTime + duration);
        }

        function playSuccessSound() {
            initAudio();
            playTone(523.25, 'sine', 0.2, 0);
            playTone(783.99, 'sine', 0.4, 0.15);
        }

        function playErrorSound() {
            initAudio();
            playTone(349.23, 'triangle', 0.3, 0);
            playTone(261.63, 'triangle', 0.4, 0.2);
        }

        function calculatePolygonArea(pts) {
            let area = 0;
            for (let i = 0; i < pts.length; i++) {
                let j = (i + 1) % pts.length;
                area += pts[i].x * pts[j].y;
                area -= pts[j].x * pts[i].y;
            }
            return Math.abs(area) / 2;
        }

        function drawBoardAndShape(N, pts) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const padding = 40;
            const availableWidth = canvas.width - 2 * padding;
            const cellWidth = availableWidth / N;

            ctx.fillStyle = '#3e2723';
            for (let x = 0; x <= N; x++) {
                for (let y = 0; y <= N; y++) {
                    ctx.beginPath();
                    ctx.arc(padding + x * cellWidth, padding + y * cellWidth, 4, 0, 2 * Math.PI);
                    ctx.fill();
                    
                    ctx.fillStyle = '#795548';
                    ctx.beginPath();
                    ctx.arc(padding + x * cellWidth - 1, padding + y * cellWidth - 1, 1.5, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#3e2723';
                }
            }

            if (pts && pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(padding + pts[0].x * cellWidth, padding + pts[0].y * cellWidth);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(padding + pts[i].x * cellWidth, padding + pts[i].y * cellWidth);
                }
                ctx.closePath();

                ctx.fillStyle = 'rgba(39, 174, 96, 0.6)';
                ctx.fill();

                ctx.strokeStyle = '#1e8449';
                ctx.lineWidth = 5;
                ctx.lineJoin = 'round';
                ctx.stroke();
            }
        }
        
        function updateScoreboard() {
            roundDisplay.innerText = 'Runde: ' + round;
            scoreDisplay.innerText = 'Punkte: ' + score;
        }

        function drawEmptyBoard() {
            currentN = 10; // Standardgröße für das leere Brett
            drawBoardAndShape(currentN, []);
            feedbackDiv.className = 'feedback-info';
            feedbackDiv.innerHTML = 'Klicke auf "Neue Aufgabe", um zu beginnen!';
            numInput.disabled = true;
            denInput.disabled = true;
            checkBtn.disabled = true;
            numInput.value = '';
            denInput.value = '';
        }

        function generateTask() {
            initAudio(); // Audio Context aktivieren
            round++;
            taskActive = true;
            taskSolved = false;
            updateScoreboard();
            
            numInput.disabled = false;
            denInput.disabled = false;
            checkBtn.disabled = false;
            
            feedbackDiv.innerHTML = '';
            numInput.value = '';
            denInput.value = '';
            numInput.focus();

            currentN = Math.floor(Math.random() * 7) + 4; 
            totalArea = currentN * currentN;

            let pts = [];
            let type = Math.floor(Math.random() * 4); 

            let w = Math.floor(Math.random() * (currentN - 1)) + 2; 
            let h = Math.floor(Math.random() * (currentN - 1)) + 2; 
            let startX = Math.floor(Math.random() * (currentN - w + 1));
            let startY = Math.floor(Math.random() * (currentN - h + 1));

            if (type === 0) {
                pts = [
                    {x: startX, y: startY}, 
                    {x: startX + w, y: startY}, 
                    {x: startX + w, y: startY + h}, 
                    {x: startX, y: startY + h}
                ];
            } else if (type === 1) {
                let corner = Math.floor(Math.random() * 4);
                if(corner===0) pts = [{x: startX, y: startY}, {x: startX+w, y: startY}, {x: startX, y: startY+h}];
                if(corner===1) pts = [{x: startX, y: startY}, {x: startX+w, y: startY}, {x: startX+w, y: startY+h}];
                if(corner===2) pts = [{x: startX+w, y: startY}, {x: startX+w, y: startY+h}, {x: startX, y: startY+h}];
                if(corner===3) pts = [{x: startX, y: startY}, {x: startX+w, y: startY+h}, {x: startX, y: startY+h}];
            } else if (type === 2) {
                let k = Math.floor(Math.random() * (w + 1));
                if(Math.random() > 0.5) {
                    pts = [{x: startX, y: startY+h}, {x: startX+w, y: startY+h}, {x: startX+k, y: startY}];
                } else {
                    pts = [{x: startX, y: startY}, {x: startX+w, y: startY}, {x: startX+k, y: startY+h}];
                }
            } else {
                let w1 = Math.floor(Math.random() * (w-1)) + 1;
                let h1 = Math.floor(Math.random() * (h-1)) + 1;
                let missingCorner = Math.floor(Math.random() * 4);
                if (missingCorner === 0) {
                    pts = [{x:startX, y:startY}, {x:startX+w1, y:startY}, {x:startX+w1, y:startY+h1}, {x:startX+w, y:startY+h1}, {x:startX+w, y:startY+h}, {x:startX, y:startY+h}];
                } else if (missingCorner === 1) {
                    pts = [{x:startX, y:startY}, {x:startX+w, y:startY}, {x:startX+w, y:startY+h1}, {x:startX+w1, y:startY+h1}, {x:startX+w1, y:startY+h}, {x:startX, y:startY+h}];
                } else if (missingCorner === 2) {
                    pts = [{x:startX, y:startY}, {x:startX+w, y:startY}, {x:startX+w, y:startY+h}, {x:startX+w1, y:startY+h}, {x:startX+w1, y:startY+h1}, {x:startX, y:startY+h1}];
                } else {
                    pts = [{x:startX+w1, y:startY}, {x:startX+w, y:startY}, {x:startX+w, y:startY+h}, {x:startX, y:startY+h}, {x:startX, y:startY+h1}, {x:startX+w1, y:startY+h1}];
                }
            }

            targetArea = calculatePolygonArea(pts);
            drawBoardAndShape(currentN, pts);
        }

        function checkAnswer() {
            if (!taskActive) return;
            initAudio(); 
            
            let userNumStr = numInput.value.trim().replace(',', '.');
            let userNum = parseFloat(userNumStr);
            let userDen = parseInt(denInput.value.trim(), 10);

            if (isNaN(userNum) || isNaN(userDen)) {
                feedbackDiv.className = 'feedback-error';
                feedbackDiv.innerHTML = '⚠️ Bitte trage in beide Felder Zahlen ein.';
                return;
            }

            if (userDen !== totalArea) {
                feedbackDiv.className = 'feedback-error';
                feedbackDiv.innerHTML = '❌ Das stimmt leider noch nicht.<br><span style="font-size:0.9rem; font-weight:normal;">Tipp: Zähle nochmal, aus wie vielen Quadraten das GESAMTE Geobrett besteht.</span>';
                playErrorSound();
                return;
            }

            if (userNum !== targetArea) {
                feedbackDiv.className = 'feedback-error';
                feedbackDiv.innerHTML = '❌ Das stimmt leider noch nicht.<br><span style="font-size:0.9rem; font-weight:normal;">Tipp: Der Nenner ist richtig, aber zähle die grüne Fläche nochmal.</span>';
                playErrorSound();
                return;
            }

            feedbackDiv.className = 'feedback-success';
            feedbackDiv.innerHTML = '✅ Klasse! Das ist richtig.';
            playSuccessSound();
            
            if (!taskSolved) {
                score++;
                taskSolved = true;
                updateScoreboard();
            }
        }

        checkBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', generateTask);
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !checkBtn.disabled) {
                checkAnswer();
            }
        });

        // Initiale Anzeige beim ersten Laden
        drawEmptyBoard();
        updateScoreboard();
    </script>
</body>
</html>
